<title>Open Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;1,6..96,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #f5f3ee; --paper-2: #ebe8e0; --card: #ffffff;
    --ink: #141414; --ink-2: #4a4742; --ink-3: #8a867e;
    --rule: #141414; --hair: #d9d5cc; --hair-2: #c7c2b7;
    --btn: #141414; --btn-ink: #f5f3ee;
    --ok: #1f7a4d; --ok-ring: #4fc98d; --ok-soft: #e3f4ea;
    --stripe: rgba(255,255,255,.34);
    --c-sky: #8fb3e3; --c-navy: #5b7fc2; --c-coral: #e9705e; --c-brick: #c7503f;
    --c-sand: #f0d6a8; --c-butter: #f0c25a; --c-lilac: #b9aaea; --c-violet: #8f7cd6;
    --c-mint: #86c4a4; --c-sage: #4f9c7d; --c-blush: #f2b6bd; --c-tangerine: #f2b077;
    --c-orange: #e98a3c; --c-slate: #a5b0c4; --c-steel: #6f7d99; --c-wood: #e8d5b0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18181b; --paper-2: #222226; --card: #1f1f23;
      --ink: #ecebe6; --ink-2: #b9b6ae; --ink-3: #85827b;
      --rule: #ecebe6; --hair: #33333a; --hair-2: #45454d;
      --btn: #ecebe6; --btn-ink: #18181b;
      --ok: #6fd39a; --ok-ring: #4fc98d; --ok-soft: #1c3327;
      --stripe: rgba(0,0,0,.18);
      --c-wood: #b59c74;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #18181b; --paper-2: #222226; --card: #1f1f23;
    --ink: #ecebe6; --ink-2: #b9b6ae; --ink-3: #85827b;
    --rule: #ecebe6; --hair: #33333a; --hair-2: #45454d;
    --btn: #ecebe6; --btn-ink: #18181b;
    --ok: #6fd39a; --ok-ring: #4fc98d; --ok-soft: #1c3327;
    --stripe: rgba(0,0,0,.18);
    --c-wood: #b59c74;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  code, .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; }
  .display { font-family: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif; }
  .caps { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }

  /* top bar */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .bar-in { max-width: 1120px; margin: 0 auto; padding: 10px clamp(16px, 4vw, 32px); display: flex; align-items: center; gap: 22px; }
  .logo { font-family: "Bodoni Moda", Georgia, serif; font-weight: 700; font-size: 21px; letter-spacing: -.01em; text-decoration: none; white-space: nowrap; }
  .bar nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .bar nav a { text-decoration: none; padding: 5px 10px; border-radius: 999px; border: 1px solid transparent; color: var(--ink); font-size: 14px; }
  .bar nav a:hover { border-color: var(--hair-2); background: var(--paper-2); }
  .bar nav a .n { color: var(--ink-3); margin-left: 5px; font-variant-numeric: tabular-nums; }
  .bar nav a[hidden] { display: none; }
  .bar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 7px; }
  .live .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-ring); box-shadow: 0 0 0 3px var(--ok-soft); }
  @media (max-width: 720px) { .bar-right .hide-sm { display: none; } }

  .page { max-width: 1120px; margin: 0 auto; padding-block: 0 96px; padding-inline: clamp(16px, 4vw, 32px); }

  /* hero */
  .hero { text-align: center; padding-block: 56px 24px; display: grid; justify-items: center; gap: 6px; }
  .hero h1 { margin: 0; font-family: "Bodoni Moda", "Didot", Georgia, serif; font-weight: 400; text-transform: uppercase; font-size: clamp(54px, 9vw, 108px); line-height: .88; letter-spacing: .005em; text-wrap: balance; font-variation-settings: "opsz" 96; }
  .hero h1 span { display: block; }
  .hero svg { width: min(640px, 100%); height: auto; display: block; margin-block: 10px 6px; }
  .lede { margin: 0; font-size: clamp(18px, 2.2vw, 23px); line-height: 1.35; color: var(--ink); max-width: 44ch; text-wrap: balance; }
  .lede b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .hero .sub { color: var(--ink-3); font-size: 13px; margin-top: 6px; }

  /* section labels */
  .label-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); margin-top: 52px; }
  .label-row .hint { color: var(--ink-3); font-size: 12.5px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .arrows { display: flex; gap: 6px; }
  .arrows button { width: 30px; height: 26px; border: 1px solid var(--hair-2); background: var(--card); border-radius: 5px; cursor: pointer; color: var(--ink); font: inherit; display: grid; place-items: center; }
  .arrows button:disabled { opacity: .35; cursor: default; }

  /* featured shelf */
  .shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(180px, 1fr); gap: 18px; padding: 22px 6px 18px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin; }
  .shelf:empty { display: none; }
  .book { scroll-snap-align: start; display: grid; gap: 10px; text-decoration: none; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; font: inherit; text-align: left; border-radius: 6px; }
  .book:focus-visible { outline-offset: 6px; }
  .cover { position: relative; aspect-ratio: 3 / 4.3; border-radius: 3px; overflow: hidden; background: var(--base); box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 10px 24px -18px rgba(0,0,0,.45); }
  .cover::before { content: ""; position: absolute; inset: 22% 14% 30% 14%; background: var(--blob); border-radius: var(--blob-r, 50%); filter: blur(22px); opacity: .95; transform: rotate(var(--blob-t, 0deg)); }
  .cover::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(var(--stripe-dir, 0deg), var(--stripe) 0 11px, transparent 11px 24px); }
  .cover .mark { position: absolute; left: 10px; top: 10px; z-index: 1; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: rgba(0,0,0,.55); background: rgba(255,255,255,.55); padding: 2px 6px; border-radius: 3px; }
  .book h3 { margin: 0; font-family: "Bodoni Moda", Georgia, serif; font-weight: 600; font-size: 19px; line-height: 1.15; letter-spacing: -.005em; }
  .book .by { font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .book .by .who { font-family: "Instrument Sans", sans-serif; font-style: normal; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; color: var(--ink); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.35); background: var(--dot, transparent); flex: none; }
  .book[draggable="true"] { cursor: grab; }
  .book[draggable="true"]:active { cursor: grabbing; }
  .book.dragging { opacity: .45; }
  .book.moved .cover { outline: 2px solid var(--ok-ring); outline-offset: 3px; }

  /* filter */
  .filter-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 44px; flex-wrap: wrap; }
  .filter-row .caps { color: var(--ink-2); }
  .seg { display: inline-flex; border: 1px solid var(--hair-2); border-radius: 999px; padding: 3px; background: var(--card); gap: 2px; }
  .seg button { appearance: none; border: 1.5px solid transparent; background: transparent; color: var(--ink-3); font: inherit; font-size: 13.5px; padding: 5px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { color: var(--ok); border-color: var(--ok-ring); background: var(--ok-soft); font-weight: 500; }
  .seg button .n { margin-left: 5px; opacity: .7; font-variant-numeric: tabular-nums; }

  /* ledger */
  .ledger { margin-top: 26px; }
  .cols, .row-main { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 220px) 96px 110px; gap: 0 16px; align-items: center; }
  @media (max-width: 860px) { .cols, .row-main { grid-template-columns: 26px minmax(0, 1fr) 96px; } .col-branch, .col-state { display: none; } }
  .cols { padding: 6px 12px; border-bottom: 1px solid var(--rule); }
  .cols .col-when, .row-main .col-when { text-align: right; }
  .group-h { margin: 0; padding: 26px 12px 6px; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--hair); scroll-margin-top: 70px; }
  .group-h .n { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; font-size: 12px; }
  .group-h .hint { color: var(--ink-3); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12.5px; margin-left: auto; }
  .group[hidden] { display: none; }
  .row { border-bottom: 1px solid var(--hair); scroll-margin-top: 80px; }
  .row-main { width: 100%; padding: 12px 12px; appearance: none; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
  .row-main:hover { background: var(--paper-2); }
  .row-main .t { font-family: "Bodoni Moda", Georgia, serif; font-weight: 500; font-size: 18px; line-height: 1.2; letter-spacing: -.005em; display: block; }
  .row-main .proj { display: block; margin-top: 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--ink-3); }
  .row-main .col-branch { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-main .col-when { color: var(--ink-2); font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row-main .col-state { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .row-main .col-state .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--sw); flex: none; }
  .row.done .t { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--ink-3); }
  .row.done .check { color: var(--ok); font-weight: 700; }
  .row.snoozed .t { color: var(--ink-3); }
  .row.open .row-main { background: var(--paper-2); }
  .detail { padding: 4px 12px 22px 54px; display: grid; gap: 16px; }
  @media (max-width: 860px) { .detail { padding-left: 12px; } }
  .detail p { margin: 0; max-width: 68ch; font-size: 15.5px; line-height: 1.55; }
  .detail h4 { margin: 0 0 4px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--ink-3); }
  .next { border-left: 2px solid var(--ink); padding-left: 14px; }
  .note { background: var(--paper-2); border-radius: 6px; padding: 10px 14px; font-size: 14px; color: var(--ink-2); max-width: 68ch; }
  .note .who { color: var(--ink-3); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; margin-right: 8px; }
  .dumps { margin: 0; padding-left: 18px; max-width: 68ch; color: var(--ink-2); }
  .dumps .mono { color: var(--ink-3); margin-right: 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .dep { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--hair-2); color: var(--ink-2); text-decoration: none; background: var(--card); }
  .dep:hover { color: var(--ink); border-color: var(--ink-3); }
  .dep.file { cursor: help; }
  .foot { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding-top: 4px; }
  button.primary { appearance: none; border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink); font: inherit; font-weight: 600; font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  button.primary:hover { filter: brightness(1.15); }
  button.ghost, select.ghost { appearance: none; background: var(--card); border: 1px solid var(--hair-2); color: var(--ink); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button.ghost:hover, select.ghost:hover { border-color: var(--ink-3); }
  select.ghost { padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  .resume { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
  .resume code { color: var(--ink-2); background: var(--paper-2); padding: 2px 7px; border-radius: 4px; }
  button.copy { appearance: none; background: none; border: 0; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 3px 6px; border-radius: 4px; text-decoration: underline; text-underline-offset: 3px; }
  .readonly { color: var(--ink-3); font-size: 13px; }
  @media (max-width: 600px) { .resume { margin-left: 0; } }
  .empty { padding: 18px 12px; color: var(--ink-3); font-size: 14px; border-bottom: 1px solid var(--hair); }

  .colophon { margin-top: 64px; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 12.5px; color: var(--ink-3); }
  .colophon b { color: var(--ink-2); font-weight: 500; }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 160ms; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } .book.moved .cover { outline: none; } }
</style>

<header class="bar">
  <div class="bar-in">
    <a class="logo" href="#top">Open Threads</a>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="bar-right" id="bar-right"></div>
  </div>
</header>

<div class="page" id="top">
  <section class="hero" id="hero"></section>
  <div id="featured"></div>
  <div class="filter-row" id="filter"></div>
  <div class="ledger" id="ledger"></div>
  <div class="colophon" id="colophon"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="threads-data" type="application/json">__THREADS_DATA__</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById("threads-data").textContent);
  const $ = (id) => document.getElementById(id);
  const navEl = $("nav"), barRight = $("bar-right"), heroEl = $("hero"), featEl = $("featured"), filterEl = $("filter"), ledgerEl = $("ledger"), colEl = $("colophon"), toastEl = $("toast");
  const actions = new Map();
  let db = null;
  let canWrite = true;
  let pinOrder = Array.isArray(data.pinOrder) ? data.pinOrder.slice() : [];
  let pinnedSlugs = [];
  let lastMoved = null;
  let filter = "all";
  const expanded = new Set();
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const longDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    const today = new Date(data.today + "T00:00:00");
    const days = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 7) return days + " days ago";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  };
  const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("show"), 1800); };

  const PALETTES = [
    ["--c-sky", "--c-navy"], ["--c-coral", "--c-orange"], ["--c-sand", "--c-butter"], ["--c-lilac", "--c-violet"],
    ["--c-mint", "--c-sage"], ["--c-blush", "--c-coral"], ["--c-tangerine", "--c-brick"], ["--c-slate", "--c-steel"],
  ];
  const hash = (s) => { let h = 5381; for (const ch of String(s)) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return h; };
  const paletteFor = (slug) => PALETTES[hash(slug) % PALETTES.length];
  const coverStyle = (slug) => {
    const [base, blob] = paletteFor(slug);
    const h = hash(slug + "x");
    const shapes = ["50%", "8%", "50% 50% 8% 8%", "40% 60% 55% 45%"];
    return `--base: var(${base}); --blob: var(${blob}); --blob-r: ${shapes[h % shapes.length]}; --blob-t: ${(h % 5) * 6 - 12}deg; --stripe-dir: ${h % 3 === 0 ? "90deg" : "0deg"};`;
  };
  const projectDots = {};
  const PROJECT_COLORS = ["--c-sky", "--c-coral", "--c-butter", "--c-sage", "--c-violet", "--c-orange", "--c-steel", "--c-blush"];
  const dotFor = (project) => {
    const key = project || "other";
    if (!(key in projectDots)) projectDots[key] = PROJECT_COLORS[Object.keys(projectDots).length % PROJECT_COLORS.length];
    return `var(${projectDots[key]})`;
  };

  function effective(t) {
    const a = actions.get(t.slug);
    const out = { state: t.state, pinned: !!t.pinned, snoozeUntil: t.snoozeUntil || null, done: !!t.done };
    if (a) {
      if (a.action === "done" || a.action === "drop") out.done = true;
      else if (a.action === "restore") { out.done = false; out.state = t.state === "snoozed" ? "active" : t.state; out.snoozeUntil = null; }
      else if (a.action === "snooze") { out.state = "snoozed"; out.snoozeUntil = a.until || null; }
      else if (a.action === "pin") out.pinned = true;
      else if (a.action === "unpin") out.pinned = false;
    }
    if (out.state === "snoozed" && out.snoozeUntil && out.snoozeUntil <= data.today) out.state = "active";
    return out;
  }
  const lane = (e) => (e.pinned && (e.state === "active" || e.state === "finished")) ? "pinned" : e.state;
  const LANE_LABEL = { pinned: "Pinned", active: "Active", inbox: "Inbox", finished: "Looks finished", snoozed: "Snoozed" };
  const LANE_HINT = { pinned: "drag the covers to set the order", active: "where the last session left off", inbox: "thoughts saved with /dump", finished: "recent sessions that read as answered", snoozed: "hidden until the date passes" };
  const LANE_SW = { pinned: "var(--c-butter)", active: "var(--c-sky)", inbox: "var(--c-lilac)", finished: "var(--hair-2)", snoozed: "var(--c-slate)" };

  function sortPinned(rows) {
    const idx = new Map(pinOrder.map((s, i) => [s, i]));
    return rows
      .map((row, i) => [row, idx.has(row[0].slug) ? idx.get(row[0].slug) : pinOrder.length + i])
      .sort((a, b) => a[1] - b[1])
      .map(([row]) => row);
  }
  function snoozeDates() {
    const base = new Date(data.today + "T00:00:00");
    const iso = (d) => d.toISOString().slice(0, 10);
    const tomorrow = new Date(base); tomorrow.setDate(base.getDate() + 1);
    const monday = new Date(base); monday.setDate(base.getDate() + ((8 - base.getDay()) % 7 || 7));
    const nextWeek = new Date(base); nextWeek.setDate(base.getDate() + 7);
    return [["Tomorrow", iso(tomorrow)], ["Monday", iso(monday)], ["Next week", iso(nextWeek)]];
  }

  /* spools of thread: one per open thread, coloured like its cover */
  function spoolsSVG(threads) {
    const list = threads.slice(0, 9);
    if (!list.length) return "";
    const W = 640, H = 180, baseY = 150;
    const gap = Math.min(78, (W - 60) / Math.max(list.length, 4));
    const total = gap * (list.length - 1);
    let x0 = (W - total) / 2;
    const parts = [];
    const stroke = "var(--ink)";
    let prevTop = null;
    list.forEach((t, i) => {
      const h = 58 + ((hash(t.slug) % 5) * 9);
      const w = 42 + ((hash(t.slug + "w") % 3) * 6);
      const x = x0 + i * gap, top = baseY - h;
      const [base] = paletteFor(t.slug);
      const col = `var(${base})`;
      const rx = w / 2, ry = 7;
      const wraps = [];
      for (let y = top + 12; y < baseY - 10; y += 6) wraps.push(`<line x1="${x - rx + 3}" y1="${y}" x2="${x + rx - 3}" y2="${y}" stroke="rgba(0,0,0,.28)" stroke-width="1"/>`);
      parts.push(`<g>
        <rect x="${x - rx}" y="${top + ry}" width="${w}" height="${h - ry * 2}" fill="${col}" stroke="${stroke}" stroke-width="1.5"/>
        ${wraps.join("")}
        <ellipse cx="${x}" cy="${baseY - ry}" rx="${rx + 5}" ry="${ry + 2}" fill="var(--c-wood)" stroke="${stroke}" stroke-width="1.5"/>
        <ellipse cx="${x}" cy="${top + ry}" rx="${rx + 5}" ry="${ry + 2}" fill="var(--c-wood)" stroke="${stroke}" stroke-width="1.5"/>
        <ellipse cx="${x}" cy="${top + ry}" rx="${rx - 6}" ry="${ry - 3}" fill="${col}" stroke="${stroke}" stroke-width="1"/>
        <circle cx="${x}" cy="${top + ry}" r="2.2" fill="${stroke}"/>
      </g>`);
      if (prevTop) {
        const [px, py] = prevTop;
        const cx = (px + x) / 2, cy = Math.min(py, top) - 26 - (i % 2) * 10;
        parts.push(`<path d="M${px + 6},${py + 10} Q${cx},${cy} ${x - 6},${top + 12}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round"/>`);
      }
      prevTop = [x, top];
    });
    const [lx, ly] = prevTop;
    parts.push(`<path d="M${lx + 8},${ly + 14} C${lx + 60},${ly - 30} ${lx + 90},${ly + 60} ${lx + 120},${baseY - 4}" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0 0"/>`);
    parts.push(`<line x1="${lx + 96}" y1="${baseY - 40}" x2="${lx + 124}" y2="${baseY - 2}" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="${lx + 99}" cy="${baseY - 36}" r="2.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>`);
    parts.push(`<line x1="40" y1="${baseY + 4}" x2="${W - 40}" y2="${baseY + 4}" stroke="var(--ink)" stroke-width="1.2"/>`);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${list.length} spools of thread, one per open thread">${parts.join("")}</svg>`;
  }

  function bookHTML(t, e, drag) {
    return `<button class="book" data-slug="${esc(t.slug)}" ${drag ? `draggable="true" title="Drag to reorder (Alt+←/→ from the keyboard)"` : ""} type="button">
      <div class="cover" style="${coverStyle(t.slug)}">${e.done ? `<span class="mark">closed</span>` : ""}</div>
      <h3>${esc(t.title)}</h3>
      <div class="by">${t.project ? `in <span class="who">${esc(t.project)}</span><span class="dot" style="--dot:${dotFor(t.project)}"></span>` : ""}<span>· ${esc(fmtDate(t.lastActive))}</span></div>
    </button>`;
  }

  function rowHTML(t, e, key) {
    const l = lane(e);
    const closed = e.done || l === "snoozed";
    const isOpen = expanded.has(t.slug);
    const stateText = e.done ? "closed" : l === "snoozed" ? "until " + (e.snoozeUntil || "?") : LANE_LABEL[l].toLowerCase();
    const links = (t.links || []).map((x) => x.url.startsWith("file://")
      ? `<span class="dep file" title="${esc(x.url.slice(7))}">${esc(x.label)} · <span class="mono">${esc(x.url.split("/").pop())}</span></span>`
      : `<a class="dep" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("");
    const dumps = (t.dumps || []).length ? `<div><h4>From the inbox</h4><ul class="dumps">${t.dumps.map((d) => `<li><span class="mono">${esc(fmtDate(d.at))}</span>${esc(d.text)}</li>`).join("")}</ul></div>` : "";
    const resume = t.sessionId ? `<span class="resume">resume <code>claude --resume ${esc(t.sessionId.slice(0, 8))}</code><button class="copy" data-copy="claude --resume ${esc(t.sessionId)}" type="button">Copy</button></span>` : "";
    const snooze = snoozeDates().map(([label, iso]) => `<option value="${iso}">${label}</option>`).join("");
    const controls = !canWrite ? `<span class="readonly">Read-only view</span>` : closed
      ? `<button class="ghost" data-act="restore" type="button">${e.done ? "Undo" : "Restore"}</button>`
      : `<button class="primary" data-act="done" type="button">Close</button><button class="ghost" data-act="${e.pinned ? "unpin" : "pin"}" type="button">${e.pinned ? "Unpin" : "Pin"}</button><select class="ghost" data-act="snooze" aria-label="Snooze" id="snooze-${esc(t.slug)}"><option value="">Snooze</option>${snooze}</select>`;
    const body = `
        ${t.rundown ? `<p>${esc(t.rundown)}</p>` : ""}
        ${t.next ? `<div class="next"><h4>Next</h4><p>${esc(t.next)}</p></div>` : ""}
        ${t.note ? `<div class="note"><span class="who">Your note</span>${esc(t.note)}</div>` : ""}
        ${dumps}
        ${links ? `<div class="links">${links}</div>` : ""}
        ${(t.sources || []).length ? `<div class="links">${t.sources.map((s) => `<span class="dep">${esc(s)}</span>`).join("")}</div>` : ""}
        <div class="foot">${controls}${resume}</div>`;
    return `<div class="row${e.done ? " done" : ""}${l === "snoozed" ? " snoozed" : ""}${isOpen ? " open" : ""}" id="t-${esc(t.slug)}" data-slug="${esc(t.slug)}">
      <button class="row-main" type="button" aria-expanded="${isOpen}" data-toggle="${esc(t.slug)}">
        <span class="dot" style="--dot:${t.project ? dotFor(t.project) : "transparent"}" title="${esc(t.project || "")}"></span>
        <span class="col-title"><span class="t">${e.done ? `<span class="check">✓ </span>` : ""}${esc(t.title)}</span>${t.project ? `<span class="proj">${esc(t.project)}</span>` : ""}</span>
        <span class="col-branch mono">${esc(t.branch || "")}</span>
        <span class="col-when">${esc(fmtDate(t.lastActive))}</span>
        <span class="col-state"><span class="sw" style="--sw:${LANE_SW[key] || "transparent"}"></span>${esc(stateText)}</span>
      </button>
      <div class="detail" ${isOpen ? "" : "hidden"}>${body}</div>
    </div>`;
  }

  function render() {
    const focusedEl = document.activeElement;
    const focused = focusedEl && focusedEl.dataset
      ? focusedEl.dataset.act ? `#${focusedEl.closest(".row")?.id} [data-act="${focusedEl.dataset.act}"]`
      : focusedEl.dataset.slug && focusedEl.classList.contains("book") ? `.book[data-slug="${focusedEl.dataset.slug}"]`
      : focusedEl.dataset.toggle ? `[data-toggle="${focusedEl.dataset.toggle}"]`
      : focusedEl.dataset.filter ? `[data-filter="${focusedEl.dataset.filter}"]` : null
      : null;

    const rows = (data.threads || []).map((t) => [t, effective(t)]);
    const inboxRows = (data.inbox || []).map((i) => {
      const t = { slug: i.slug, title: i.text, project: i.project, lastActive: i.at, state: i.state || "inbox", sources: ["dump"] };
      return [t, effective(t)];
    });
    const by = (k) => rows.filter(([, e]) => lane(e) === k);
    const pinned = sortPinned(by("pinned")), active = by("active"), finished = by("finished"), snoozed = by("snoozed");
    pinnedSlugs = pinned.map(([t]) => t.slug);
    const groups = [["pinned", pinned], ["active", active], ["inbox", inboxRows], ["finished", finished], ["snoozed", snoozed]];
    const live = data.liveSessions || [];
    const doneCount = rows.concat(inboxRows).filter(([, e]) => e.done).length;
    const openRows = pinned.concat(active).filter(([, e]) => !e.done);
    const open = openRows.length;

    navEl.innerHTML = groups.map(([k, r]) => `<a href="#g-${k}" ${r.length ? "" : "hidden"}>${esc(LANE_LABEL[k])}<span class="n">${r.length}</span></a>`).join("");
    barRight.innerHTML = `${live.length ? `<span class="live"><span class="pulse"></span>${live.length} live session${live.length === 1 ? "" : "s"}</span>` : `<span class="live">No other session is live</span>`}<span class="hide-sm">Rebuilt with <b class="mono">/threads</b></span>`;

    heroEl.innerHTML = `
      <h1><span>Open</span><span>Threads</span></h1>
      ${spoolsSVG(openRows.map(([t]) => t))}
      <p class="lede"><b>${open}</b> thread${open === 1 ? "" : "s"} open${pinned.length ? `, <b>${pinned.length}</b> pinned` : ""}${inboxRows.length ? `, <b>${inboxRows.length}</b> in the inbox` : ""}${finished.length ? `, <b>${finished.length}</b> that look finished` : ""}${snoozed.length ? `, <b>${snoozed.length}</b> snoozed` : ""}${doneCount ? `, <b>${doneCount}</b> closed` : ""}.</p>
      <div class="sub">${esc(longDate(data.today))} · every project under your roots · one spool per open thread</div>`;

    const drag = canWrite && pinned.length > 1;
    featEl.innerHTML = pinned.length ? `
      <div class="label-row"><span class="caps">Pinned <span class="hint">${esc(drag ? LANE_HINT.pinned : "")}</span></span><div class="arrows"><button type="button" data-scroll="-1" aria-label="Scroll left">←</button><button type="button" data-scroll="1" aria-label="Scroll right">→</button></div></div>
      <div class="shelf" id="shelf">${pinned.map(([t, e]) => bookHTML(t, e, drag)).join("")}</div>` : "";

    const FILTERS = [["all", "All"], ["active", "Active"], ["finished", "Looks finished"], ["snoozed", "Snoozed"]];
    const countFor = (k) => k === "all" ? rows.length + inboxRows.length : k === "active" ? pinned.length + active.length + inboxRows.length : by(k).length;
    filterEl.innerHTML = `<span class="caps">Show</span><div class="seg" role="group" aria-label="Filter threads">${FILTERS.map(([k, l]) => `<button type="button" data-filter="${k}" aria-pressed="${filter === k}">${l}<span class="n">${countFor(k)}</span></button>`).join("")}</div>`;

    const visible = (k) => filter === "all" || (filter === "active" ? (k === "pinned" || k === "active" || k === "inbox") : filter === k);
    ledgerEl.innerHTML = `<div class="cols caps" style="color:var(--ink-3)"><span></span><span>Title</span><span class="col-branch">Branch</span><span class="col-when">Last active</span><span class="col-state">State</span></div>` +
      groups.map(([k, r]) => `<section class="group" id="g-${k}" ${visible(k) && (r.length || k === "active" || k === "inbox") ? "" : "hidden"}>
        <h2 class="group-h caps">${esc(LANE_LABEL[k])}<span class="n">${r.length}</span><span class="hint">${esc(LANE_HINT[k])}</span></h2>
        ${r.length ? r.map(([t, e]) => rowHTML(t, e, k)).join("") : `<div class="empty">${k === "inbox" ? "Nothing dumped. Run /dump <thought> in any session." : "No open threads."}</div>`}
      </section>`).join("");

    colEl.innerHTML = `<span>${live.length ? "Live now: " + live.map((s) => `<b class="mono">${esc(s.name)}</b>${s.project ? " in " + esc(s.project) : ""}${s.idle ? " (idle)" : ""}`).join(", ") : "No other session is live right now"}</span><span>Close, Pin, Snooze and the pinned order are remembered for the next run.</span><span>Add a thought with <b class="mono">/dump</b></span>`;

    if (lastMoved) {
      document.querySelectorAll(`.book[data-slug="${lastMoved}"]`).forEach((el) => el.classList.add("moved"));
      lastMoved = null;
    }
    if (focused) { const el = document.querySelector(focused); if (el && !el.disabled) el.focus(); }
  }

  async function write(slug, action, extra) {
    if (!db) { toast("Not connected to storage; nothing saved."); return; }
    const src = (data.threads || []).find((t) => t.slug === slug) || (data.inbox || []).find((i) => i.slug === slug) || {};
    const doc = { slug, action, at: new Date().toISOString(), title: src.title || src.text || null, ...extra };
    try {
      await db.doc("actions/" + slug).set(doc);
      toast({ done: "Closed", pin: "Pinned", unpin: "Unpinned", snooze: "Snoozed until " + (extra.until || ""), restore: "Restored" }[action]);
    } catch (e) {
      if (e && e.code === "invalid_argument") { canWrite = false; render(); }
      toast("Couldn't save: " + (e && e.message ? e.message : "unknown error"));
    }
  }

  async function saveOrder(order, moved) {
    if (order.join("\n") === pinnedSlugs.join("\n")) { render(); return; }
    if (!db) { render(); toast("Not connected to storage; nothing saved."); return; }
    const prev = pinOrder;
    lastMoved = moved || null;
    pinOrder = order;
    render();
    try {
      await db.doc("settings/pinOrder").set({ key: "pinOrder", order, at: new Date().toISOString() });
      toast("Order saved");
    } catch (e) {
      pinOrder = prev;
      if (e && e.code === "invalid_argument") canWrite = false;
      render();
      toast("Couldn't save: " + (e && e.message ? e.message : "unknown error"));
    }
  }

  function openRow(slug) {
    expanded.add(slug);
    render();
    const row = document.getElementById("t-" + slug);
    if (row) row.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  }

  document.addEventListener("click", (ev) => {
    const copy = ev.target.closest("[data-copy]");
    if (copy) {
      const txt = copy.getAttribute("data-copy");
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Copied"), () => toast(txt));
      return;
    }
    const act = ev.target.closest("button[data-act]");
    if (act) { write(act.closest(".row").dataset.slug, act.dataset.act, {}); return; }
    const tog = ev.target.closest("[data-toggle]");
    if (tog) { const s = tog.dataset.toggle; expanded.has(s) ? expanded.delete(s) : expanded.add(s); render(); return; }
    const book = ev.target.closest(".book[data-slug]");
    if (book && !suppressClick) { filter = "all"; openRow(book.dataset.slug); return; }
    const f = ev.target.closest("[data-filter]");
    if (f) { filter = f.dataset.filter; render(); return; }
    const sc = ev.target.closest("[data-scroll]");
    if (sc) { const shelf = $("shelf"); if (shelf) shelf.scrollBy({ left: Number(sc.dataset.scroll) * 240, behavior: reduceMotion ? "auto" : "smooth" }); }
  });
  document.addEventListener("change", (ev) => {
    const sel = ev.target.closest("select[data-act='snooze']");
    if (!sel || !sel.value) return;
    write(sel.closest(".row").dataset.slug, "snooze", { until: sel.value });
  });

  /* drag the pinned covers */
  let dragSlug = null, dropped = false, suppressClick = false;
  const shelfOrder = () => [...featEl.querySelectorAll(".book[data-slug]")].map((b) => b.dataset.slug);
  featEl.addEventListener("dragstart", (ev) => {
    const book = ev.target.closest(".book[draggable='true']");
    if (!book || !canWrite) return;
    dragSlug = book.dataset.slug; dropped = false;
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", dragSlug);
    requestAnimationFrame(() => book.classList.add("dragging"));
  });
  featEl.addEventListener("dragover", (ev) => {
    if (!dragSlug) return;
    const shelf = $("shelf"); if (!shelf || !shelf.contains(ev.target)) return;
    ev.preventDefault(); ev.dataTransfer.dropEffect = "move";
    const dragged = shelf.querySelector(`.book[data-slug="${dragSlug}"]`);
    let best = null, bestDist = Infinity;
    shelf.querySelectorAll(".book").forEach((b) => {
      if (b === dragged) return;
      const r = b.getBoundingClientRect();
      const d = Math.abs(ev.clientX - (r.left + r.width / 2));
      if (d < bestDist) { best = b; bestDist = d; }
    });
    if (!best) return;
    const r = best.getBoundingClientRect();
    const after = ev.clientX > r.left + r.width / 2;
    if ((after && best.nextElementSibling === dragged) || (!after && best.previousElementSibling === dragged)) return;
    after ? best.after(dragged) : best.before(dragged);
  });
  featEl.addEventListener("drop", (ev) => {
    if (!dragSlug) return;
    ev.preventDefault(); dropped = true;
    const slug = dragSlug; dragSlug = null;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    saveOrder(shelfOrder(), slug);
  });
  featEl.addEventListener("dragend", () => { dragSlug = null; if (!dropped) render(); dropped = false; });
  featEl.addEventListener("keydown", (ev) => {
    const book = ev.target.closest(".book[draggable='true']");
    if (!book || !ev.altKey || !canWrite || (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight")) return;
    ev.preventDefault();
    const order = pinnedSlugs.slice();
    const i = order.indexOf(book.dataset.slug), j = i + (ev.key === "ArrowLeft" ? -1 : 1);
    if (i < 0 || j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    saveOrder(order, book.dataset.slug);
  });

  render();

  (async () => {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if (!db) return;
    db.collection("actions").onSnapshot(
      (snap) => {
        actions.clear();
        snap.docs.forEach((d) => { const body = d.data(); if (body && body.slug) actions.set(body.slug, body); });
        render();
      },
      () => { toast("Live updates unavailable; reload to refresh."); }
    );
    db.collection("settings").onSnapshot(
      (snap) => {
        let incoming = null;
        snap.docs.forEach((d) => {
          const body = d.data();
          if (body && body.key === "pinOrder" && Array.isArray(body.order)) incoming = body.order.slice();
        });
        if (!incoming || incoming.join("\n") === pinOrder.join("\n")) return;
        pinOrder = incoming;
        render();
      },
      () => {}
    );
    const user = await window.claude.use("user");
    if (user && user.can) {
      const ok = await user.can("data.write");
      if (ok === false) { canWrite = false; render(); }
    }
  })();
})();
</script>
