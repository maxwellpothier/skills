<title>Open Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #eeece7;
    --ink: #1c1f26; --ink-2: #4b5060; --ink-3: #7a7f8e;
    --line: #d9d6cf; --line-2: #c4c0b6;
    --accent: #0f5f68; --accent-ink: #ffffff; --accent-soft: #dcecec;
    --ok: #1f7a4d; --ok-soft: #dff1e5;
    --warn: #8a5a00; --warn-soft: #f7ebd0;
    --err: #a3352d; --err-soft: #f8e1de;
    --lane-active: #0f5f68; --lane-pinned: #8a5a00; --lane-finished: #7a7f8e;
    --lane-snoozed: #6b3fa0; --lane-inbox: #4b5060;
    --code-bg: #eeece7;
    --shadow: 0 1px 2px rgba(28,31,38,.06), 0 8px 24px -16px rgba(28,31,38,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b; --surface: #1c1f26; --surface-2: #242830;
      --ink: #eceae4; --ink-2: #b5b3ac; --ink-3: #85838d;
      --line: #2f333d; --line-2: #3d424d;
      --accent: #63c3c9; --accent-ink: #0e1a1c; --accent-soft: #1b3438;
      --ok: #6fd39a; --ok-soft: #1c3327;
      --warn: #e2b04f; --warn-soft: #3a2f16;
      --err: #f08b82; --err-soft: #3d201d;
      --lane-active: #63c3c9; --lane-pinned: #e2b04f; --lane-finished: #85838d;
      --lane-snoozed: #b592e6; --lane-inbox: #b5b3ac;
      --code-bg: #242830;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161b; --surface: #1c1f26; --surface-2: #242830;
    --ink: #eceae4; --ink-2: #b5b3ac; --ink-3: #85838d;
    --line: #2f333d; --line-2: #3d424d;
    --accent: #63c3c9; --accent-ink: #0e1a1c; --accent-soft: #1b3438;
    --ok: #6fd39a; --ok-soft: #1c3327;
    --warn: #e2b04f; --warn-soft: #3a2f16;
    --err: #f08b82; --err-soft: #3d201d;
    --lane-active: #63c3c9; --lane-pinned: #e2b04f; --lane-finished: #85838d;
    --lane-snoozed: #b592e6; --lane-inbox: #b5b3ac;
    --code-bg: #242830;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .serif { font-family: "Newsreader", Georgia, "Times New Roman", serif; font-weight: 500; }

  .wrap { max-width: 1180px; margin: 0 auto; padding-block: 40px 96px; padding-inline: clamp(16px, 4vw, 40px); }

  header.top { display: grid; gap: 14px; max-width: 760px; margin-bottom: 40px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: clamp(34px, 4.6vw, 50px); line-height: 1.05; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
  .lede { color: var(--ink-2); font-size: 17px; max-width: 64ch; margin: 0; }
  .lede b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--ink-3); font-size: 13px; }
  .meta-row b { color: var(--ink-2); font-weight: 500; }
  .notice { border: 1px solid var(--line); border-left: 3px solid var(--warn); background: var(--surface); border-radius: 6px; padding: 12px 16px; color: var(--ink-2); font-size: 14px; max-width: 760px; }

  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 48px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; gap: 28px; } }

  nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: grid; gap: 4px; font-size: 13.5px; max-height: calc(100vh - 40px); overflow-y: auto; }
  @media (max-width: 860px) { nav.rail { position: static; max-height: none; } }
  nav.rail .lane-h { margin-top: 14px; padding-left: 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; display: flex; justify-content: space-between; padding-right: 10px; }
  nav.rail .lane-h:first-child { margin-top: 0; }
  nav.rail a { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; padding: 6px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; line-height: 1.35; }
  nav.rail a:hover { background: var(--surface-2); color: var(--ink); }
  nav.rail .dot { width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--line-2); display: inline-grid; place-items: center; }
  nav.rail a[data-lane="pinned"] .dot { border-color: var(--lane-pinned); background: var(--lane-pinned); }
  nav.rail a[data-lane="active"] .dot { border-color: var(--lane-active); }
  nav.rail a[data-lane="inbox"] .dot { border-color: var(--lane-inbox); border-style: dashed; }
  nav.rail a[data-lane="snoozed"] .dot, nav.rail a[data-lane="finished"] .dot { border-color: var(--line-2); background: var(--surface-2); }
  nav.rail a[data-done] .dot { border-color: var(--ok); background: var(--ok); color: var(--surface); font-size: 10px; line-height: 1; }
  nav.rail a[data-done] .dot::before { content: "\2713"; }
  nav.rail a[data-done] span:last-child { text-decoration: line-through; text-decoration-color: var(--ink-3); color: var(--ink-3); }
  nav.rail a.muted { color: var(--ink-3); }

  main { display: grid; gap: 36px; min-width: 0; }
  .lane { display: grid; gap: 16px; }
  .lane-title { display: flex; align-items: baseline; gap: 12px; }
  .lane-title h2 { margin: 0; font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 24px; }
  .lane-title .n { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
  .lane-title .hint { color: var(--ink-3); font-size: 13.5px; }
  details.lane > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; }
  details.lane > summary::-webkit-details-marker { display: none; }
  details.lane > summary::after { content: "Show"; margin-left: auto; font-size: 13px; color: var(--accent); }
  details.lane[open] > summary::after { content: "Hide"; }
  details.lane > .cards { margin-top: 16px; }
  .cards { display: grid; gap: 16px; }
  .empty { color: var(--ink-3); font-size: 14px; padding: 4px 0; }

  section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: clip; }
  section.card.closed { box-shadow: none; }
  .card-head { padding: 20px 28px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .card.closed .card-head { border-bottom: 0; padding-bottom: 20px; }
  @media (max-width: 600px) { .card-head, .card-body, .card-foot { padding-inline: 18px; } }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; font-weight: 500; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); }
  .chip.type { background: var(--surface-2); border-color: transparent; }
  .chip.lane { border-color: currentColor; }
  .chip.lane-active { color: var(--lane-active); } .chip.lane-pinned { color: var(--lane-pinned); }
  .chip.lane-finished { color: var(--lane-finished); } .chip.lane-snoozed { color: var(--lane-snoozed); }
  .chip.lane-inbox { color: var(--lane-inbox); }
  .chip.done { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .card.done h3.title { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
  .chips .when { margin-left: auto; color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  h3.title { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: clamp(21px, 2.2vw, 26px); line-height: 1.15; margin: 0; text-wrap: balance; }
  .card.closed h3.title { font-size: 19px; }
  .repo { color: var(--ink-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }

  .card-body { padding: 20px 28px 18px; display: grid; gap: 18px; }
  .card-body p { margin: 0; max-width: 72ch; }
  .card-body h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .next { border-left: 2px solid var(--accent); padding-left: 14px; }
  .note { background: var(--surface-2); border-radius: 8px; padding: 12px 16px; color: var(--ink-2); font-size: 14px; }
  .note .who { color: var(--ink-3); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; margin-right: 8px; }
  .dumps { margin: 0; padding-left: 18px; color: var(--ink-2); max-width: 72ch; }
  .dumps li { margin-bottom: 4px; } .dumps li:last-child { margin-bottom: 0; }
  .dumps .mono { color: var(--ink-3); margin-right: 6px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .dep { font-size: 12.5px; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); text-decoration: none; }
  .dep:hover { color: var(--ink); }
  .dep.file { cursor: help; }

  .card-foot { padding: 14px 28px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; border-top: 1px dashed var(--line); background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
  .card.closed .card-foot { border-top: 1px solid var(--line); }
  button.primary { appearance: none; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; font-size: 13.5px; padding: 8px 16px; border-radius: 7px; cursor: pointer; }
  button.primary:hover { filter: brightness(1.06); }
  button.ghost, select.ghost { appearance: none; background: transparent; border: 1px solid var(--line-2); color: var(--ink-2); font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px; cursor: pointer; }
  button.ghost:hover, select.ghost:hover { color: var(--ink); border-color: var(--ink-3); }
  select.ghost { padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
  button:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
  nav.rail .group { display: grid; gap: 4px; }
  nav.rail a[draggable="true"] { grid-template-columns: 18px 1fr 14px; cursor: grab; }
  nav.rail a[draggable="true"] .grip { color: var(--ink-3); font-size: 12px; line-height: 1.35; justify-self: end; opacity: 0; transition: opacity 120ms; }
  nav.rail a[draggable="true"]:hover .grip, nav.rail a[draggable="true"]:focus-visible .grip { opacity: 1; }
  nav.rail a[draggable="true"]:active { cursor: grabbing; }
  nav.rail a.dragging { opacity: .45; background: var(--surface-2); outline: 1.5px dashed var(--line-2); outline-offset: -1.5px; }
  nav.rail a.dragging .grip { opacity: 1; }
  nav.rail a.moved { animation: settle-row 900ms ease-out; }
  section.card.moved { animation: settle-card 900ms ease-out; }
  @keyframes settle-row { 0%, 30% { background: var(--accent-soft); color: var(--ink); } 100% { background: transparent; } }
  @keyframes settle-card { 0%, 30% { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); } 100% { box-shadow: var(--shadow); } }
  @media (prefers-reduced-motion: reduce) { nav.rail a.moved, section.card.moved { animation: none; } }
  nav.rail .rail-hint { padding: 2px 10px 0; font-size: 11.5px; color: var(--ink-3); }
  .resume { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
  .resume code { color: var(--ink-2); }
  button.copy { appearance: none; background: transparent; border: 0; color: var(--accent); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; padding: 4px 6px; border-radius: 5px; }
  button.copy:hover { background: var(--accent-soft); }
  .readonly { color: var(--ink-3); font-size: 13px; }
  @media (max-width: 600px) { .resume { margin-left: 0; } .chips .when { margin-left: 0; } }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 160ms; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap">
  <header class="top" id="top"></header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Threads"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="threads-data" type="application/json">__THREADS_DATA__</script>
<script>
(function () {
  const data = JSON.parse(document.getElementById("threads-data").textContent);
  const topEl = document.getElementById("top");
  const railEl = document.getElementById("rail");
  const mainEl = document.getElementById("main");
  const toastEl = document.getElementById("toast");
  const actions = new Map();
  let db = null;
  let canWrite = true;
  let pinOrder = Array.isArray(data.pinOrder) ? data.pinOrder.slice() : [];
  let pinnedSlugs = [];
  let lastMoved = null;
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function flip(container, selector, mutate) {
    if (reduceMotion) { mutate(); return; }
    const before = new Map();
    container.querySelectorAll(selector).forEach((el) => before.set(el.dataset.slug, el.getBoundingClientRect().top));
    mutate();
    const moving = [];
    container.querySelectorAll(selector).forEach((el) => {
      const prev = before.get(el.dataset.slug);
      if (prev == null) return;
      const dy = prev - el.getBoundingClientRect().top;
      if (Math.abs(dy) < 1) return;
      el.style.transition = "none";
      el.style.transform = `translateY(${dy}px)`;
      moving.push(el);
    });
    if (!moving.length) return;
    moving[0].getBoundingClientRect();
    requestAnimationFrame(() => {
      moving.forEach((el) => {
        el.style.transition = "transform 260ms cubic-bezier(.2, .7, .2, 1)";
        el.style.transform = "";
        el.addEventListener("transitionend", () => { el.style.transition = ""; }, { once: true });
      });
    });
  }

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const longDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return esc(iso);
    const today = new Date(data.today + "T00:00:00");
    const days = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 7) return days + " days ago";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  };
  const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("show"), 1800); };

  function effective(t) {
    const a = actions.get(t.slug);
    const out = { state: t.state, pinned: !!t.pinned, snoozeUntil: t.snoozeUntil || null, done: !!t.done };
    if (a) {
      if (a.action === "done" || a.action === "drop") out.done = true;
      else if (a.action === "restore") { out.done = false; out.state = t.state === "snoozed" ? "active" : t.state; out.snoozeUntil = null; }
      else if (a.action === "snooze") { out.state = "snoozed"; out.snoozeUntil = a.until || null; }
      else if (a.action === "pin") out.pinned = true;
      else if (a.action === "unpin") out.pinned = false;
    }
    if (out.state === "snoozed" && out.snoozeUntil && out.snoozeUntil <= data.today) out.state = "active";
    return out;
  }
  const lane = (e) => (e.pinned && (e.state === "active" || e.state === "finished")) ? "pinned" : e.state;

  function sortPinned(rows) {
    const idx = new Map(pinOrder.map((s, i) => [s, i]));
    return rows
      .map((row, i) => [row, idx.has(row[0].slug) ? idx.get(row[0].slug) : pinOrder.length + i])
      .sort((a, b) => a[1] - b[1])
      .map(([row]) => row);
  }

  function snoozeDates() {
    const base = new Date(data.today + "T00:00:00");
    const iso = (d) => d.toISOString().slice(0, 10);
    const tomorrow = new Date(base); tomorrow.setDate(base.getDate() + 1);
    const monday = new Date(base); monday.setDate(base.getDate() + ((8 - base.getDay()) % 7 || 7));
    const nextWeek = new Date(base); nextWeek.setDate(base.getDate() + 7);
    return [["Tomorrow", iso(tomorrow)], ["Monday", iso(monday)], ["Next week", iso(nextWeek)]];
  }

  const LANE_LABEL = { active: "Active", pinned: "Pinned", finished: "Looks finished", snoozed: "Snoozed", inbox: "Inbox" };

  function cardHTML(t, e) {
    const l = lane(e);
    const closed = e.done || l === "snoozed";
    const stateText = l === "snoozed" ? "snoozed until " + (e.snoozeUntil || "?") : LANE_LABEL[l];
    const links = (t.links || []).map((x) => x.url.startsWith("file://")
      ? `<span class="dep file" title="${esc(x.url.slice(7))}">${esc(x.label)} · <span class="mono">${esc(x.url.split("/").pop())}</span></span>`
      : `<a class="dep" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a>`).join("");
    const badges = (t.sources || []).map((s) => `<span class="chip type">${esc(s)}</span>`).join("");
    const dumps = (t.dumps || []).length ? `<div><h4>From the inbox</h4><ul class="dumps">${t.dumps.map((d) => `<li><span class="mono">${esc(fmtDate(d.at))}</span>${esc(d.text)}</li>`).join("")}</ul></div>` : "";
    const resume = t.sessionId ? `<span class="resume">resume <code>claude --resume ${esc(t.sessionId.slice(0, 8))}</code><button class="copy" data-copy="claude --resume ${esc(t.sessionId)}" title="Copy the full command">Copy</button></span>` : "";
    const snooze = snoozeDates().map(([label, iso]) => `<option value="${iso}">${label}</option>`).join("");
    const controls = !canWrite ? `<span class="readonly">Read-only view</span>` : closed
      ? `<button class="ghost" data-act="restore">${e.done ? "Undo" : "Restore"}</button>`
      : `<button class="primary" data-act="done">Done</button><button class="ghost" data-act="${e.pinned ? "unpin" : "pin"}">${e.pinned ? "Unpin" : "Pin"}</button><select class="ghost" data-act="snooze" aria-label="Snooze"><option value="">Snooze</option>${snooze}</select>`;
    const body = closed ? "" : `<div class="card-body">
        ${t.rundown ? `<p>${esc(t.rundown)}</p>` : ""}
        ${t.next ? `<div class="next"><h4>Next</h4><p>${esc(t.next)}</p></div>` : ""}
        ${t.note ? `<div class="note"><span class="who">Your note</span>${esc(t.note)}</div>` : ""}
        ${dumps}
        ${links ? `<div class="links">${links}</div>` : ""}
      </div>`;
    return `<section class="card${closed ? " closed" : ""}${e.done ? " done" : ""}" id="t-${esc(t.slug)}" data-slug="${esc(t.slug)}">
      <div class="card-head">
        <div class="chips">
          ${e.done ? `<span class="chip done">\u2713 Done</span>` : ""}<span class="chip lane lane-${l}">${esc(stateText)}</span>
          ${t.project ? `<span class="chip type">${esc(t.project)}</span>` : ""}
          ${badges}
          <span class="when">${esc(fmtDate(t.lastActive))}</span>
        </div>
        <h3 class="title">${esc(t.title)}</h3>
        ${t.branch ? `<div class="repo"><span class="mono">${esc(t.branch)}</span></div>` : ""}
      </div>
      ${body}
      <div class="card-foot">${controls}${resume}</div>
    </section>`;
  }

  function laneHTML(key, rows, opts = {}) {
    const cards = rows.length ? rows.map(([t, e]) => cardHTML(t, e)).join("") : `<div class="empty">${esc(opts.empty || "Nothing here.")}</div>`;
    const head = `<h2>${esc(opts.title || LANE_LABEL[key])}</h2><span class="n">${rows.length}</span>${opts.hint ? `<span class="hint">${esc(opts.hint)}</span>` : ""}`;
    if (opts.collapsed) return `<details class="lane" id="lane-${key}"><summary>${head}</summary><div class="cards">${cards}</div></details>`;
    return `<section class="lane" id="lane-${key}"><div class="lane-title">${head}</div><div class="cards">${cards}</div></section>`;
  }

  function railHTML(groups) {
    return groups.filter(([, rows]) => rows.length).map(([key, rows, title]) => {
      const drag = key === "pinned" && canWrite && rows.length > 1;
      const links = rows.map(([t, e]) => `<a href="#t-${esc(t.slug)}" data-slug="${esc(t.slug)}" data-lane="${lane(e)}"${e.done ? " data-done" : ""}${drag ? ` draggable="true" title="Drag to reorder (Alt+\u2191/\u2193 from the keyboard)"` : ""} class="${["snoozed", "finished"].includes(lane(e)) ? "muted" : ""}"><span class="dot"></span><span>${esc(t.title)}</span>${drag ? `<span class="grip" aria-hidden="true">\u22EE\u22EE</span>` : ""}</a>`).join("");
      return `<div class="lane-h"><span>${esc(title || LANE_LABEL[key])}</span><span>${rows.length}</span></div>` +
        `<div class="group" data-group="${key}">${links}</div>` +
        (drag ? `<div class="rail-hint">drag to reorder</div>` : "");
    }).join("");
  }

  function render() {
    const focusedEl = document.activeElement;
    const focused = !focusedEl ? null
      : mainEl.contains(focusedEl) && focusedEl.dataset.act ? `#${focusedEl.closest(".card")?.id} [data-act="${focusedEl.dataset.act}"]`
      : railEl.contains(focusedEl) && focusedEl.dataset.slug ? `#rail a[data-slug="${focusedEl.dataset.slug}"]`
      : null;
    const rows = (data.threads || []).map((t) => [t, effective(t)]);
    const inboxRows = (data.inbox || []).map((i) => {
      const t = { slug: i.slug, title: i.text, project: i.project, lastActive: i.at, state: i.state || "inbox", sources: ["dump"] };
      return [t, effective(t)];
    });
    const by = (k) => rows.filter(([, e]) => lane(e) === k);
    const pinned = sortPinned(by("pinned")), active = by("active"), finished = by("finished"), snoozed = by("snoozed");
    pinnedSlugs = pinned.map(([t]) => t.slug);
    const inboxOpen = inboxRows;
    const live = data.liveSessions || [];
    const doneCount = rows.concat(inboxRows).filter(([, e]) => e.done).length;
    const open = pinned.concat(active).filter(([, e]) => !e.done).length;

    topEl.innerHTML = `
      <div class="eyebrow">${esc(longDate(data.today))} · every project under your roots</div>
      <h1>Open Threads</h1>
      <p class="lede"><b>${open}</b> thread${open === 1 ? "" : "s"} open${pinned.length ? `, <b>${pinned.length}</b> pinned` : ""}${inboxOpen.length ? `, <b>${inboxOpen.length}</b> in the inbox` : ""}${finished.length ? `, and <b>${finished.length}</b> that look finished` : ""}${snoozed.length ? `. <b>${snoozed.length}</b> snoozed` : ""}${doneCount ? `. <b>${doneCount}</b> checked off` : ""}.
        Each card says where the work stood when the last session ended and what the next move is. Done, Pin, Snooze and the pinned order are remembered for the next run.</p>
      <div class="meta-row">
        ${live.length ? `<span>Live now: ${live.map((s) => `<b class="mono">${esc(s.name)}</b>${s.project ? " in " + esc(s.project) : ""}${s.idle ? " (idle)" : ""}`).join(", ")}</span>` : `<span>No other session is live right now</span>`}
        <span>Rebuilt with <b>/threads</b></span>
        <span>Add a thought with <b>/dump</b></span>
      </div>`;

    flip(railEl, "a[data-slug]", () => {
      railEl.innerHTML = railHTML([["pinned", pinned], ["active", active], ["inbox", inboxOpen], ["finished", finished, "Looks finished"], ["snoozed", snoozed]]);
    });

    flip(mainEl, "section.card[data-slug]", () => {
      mainEl.innerHTML = [
        pinned.length ? laneHTML("pinned", pinned, { hint: pinned.length > 1 ? "drag the sidebar entries to set the order" : "" }) : "",
        laneHTML("active", active, { empty: "No open threads." }),
        laneHTML("inbox", inboxOpen, { empty: "Nothing dumped. Run /dump <thought> in any session.", hint: "thoughts saved with /dump" }),
        laneHTML("finished", finished, { collapsed: true, title: "Looks finished", hint: "recent sessions that read as answered; check off or pin", empty: "Every recent session read as ongoing." }),
        laneHTML("snoozed", snoozed, { collapsed: true }),
      ].join("");
    });
    if (lastMoved) {
      document.querySelectorAll(`#rail a[data-slug="${lastMoved}"], section.card[data-slug="${lastMoved}"]`).forEach((el) => el.classList.add("moved"));
      lastMoved = null;
    }
    if (focused) {
      const el = document.querySelector(focused);
      if (el && !el.disabled) el.focus();
    }
  }

  async function write(slug, action, extra) {
    if (!db) { toast("Not connected to storage; nothing saved."); return; }
    const src = (data.threads || []).find((t) => t.slug === slug) || (data.inbox || []).find((i) => i.slug === slug) || {};
    const doc = { slug, action, at: new Date().toISOString(), title: src.title || src.text || null, ...extra };
    try {
      await db.doc("actions/" + slug).set(doc);
      toast({ done: "Checked off", pin: "Pinned", unpin: "Unpinned", snooze: "Snoozed until " + (extra.until || ""), restore: "Restored" }[action]);
    } catch (e) {
      if (e && e.code === "invalid_argument") { canWrite = false; render(); }
      toast("Couldn't save: " + (e && e.message ? e.message : "unknown error"));
    }
  }

  async function saveOrder(order, moved) {
    if (order.join("\n") === pinnedSlugs.join("\n")) { render(); return; }
    if (!db) { render(); toast("Not connected to storage; nothing saved."); return; }
    const prev = pinOrder;
    lastMoved = moved || null;
    pinOrder = order;
    render();
    try {
      await db.doc("settings/pinOrder").set({ key: "pinOrder", order, at: new Date().toISOString() });
      toast("Order saved");
    } catch (e) {
      pinOrder = prev;
      if (e && e.code === "invalid_argument") canWrite = false;
      render();
      toast("Couldn't save: " + (e && e.message ? e.message : "unknown error"));
    }
  }

  mainEl.addEventListener("click", (ev) => {
    const copy = ev.target.closest("[data-copy]");
    if (copy) {
      const txt = copy.getAttribute("data-copy");
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Copied"), () => toast(txt));
      return;
    }
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    write(btn.closest(".card").dataset.slug, btn.dataset.act, {});
  });

  const pinnedRow = (el) => el && el.closest ? el.closest('#rail .group[data-group="pinned"] a[data-slug]') : null;
  const pinnedGroup = () => railEl.querySelector('.group[data-group="pinned"]');
  const domOrder = () => [...(pinnedGroup() || railEl).querySelectorAll("a[data-slug]")].map((a) => a.dataset.slug);
  let dragSlug = null;
  let dropped = false;

  function previewAt(ev) {
    const group = pinnedGroup();
    if (!group || !group.contains(ev.target)) return false;
    const dragged = group.querySelector(`a[data-slug="${dragSlug}"]`);
    if (!dragged) return false;
    let best = null, bestDist = Infinity;
    group.querySelectorAll("a[data-slug]").forEach((row) => {
      if (row === dragged) return;
      const r = row.getBoundingClientRect();
      const dist = Math.abs(ev.clientY - (r.top + r.height / 2));
      if (dist < bestDist) { best = row; bestDist = dist; }
    });
    if (!best) return true;
    const r = best.getBoundingClientRect();
    const after = ev.clientY > r.top + r.height / 2;
    const want = after ? best.nextElementSibling : best;
    if (want === dragged || (after && best.nextElementSibling === dragged) || (!after && best.previousElementSibling === dragged)) return true;
    flip(group, "a[data-slug]", () => { after ? best.after(dragged) : best.before(dragged); });
    return true;
  }

  railEl.addEventListener("dragstart", (ev) => {
    const row = pinnedRow(ev.target);
    if (!row || !canWrite || row.getAttribute("draggable") !== "true") return;
    dragSlug = row.dataset.slug;
    dropped = false;
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", dragSlug);
    requestAnimationFrame(() => row.classList.add("dragging"));
  });
  railEl.addEventListener("dragenter", (ev) => {
    const group = pinnedGroup();
    if (dragSlug && group && group.contains(ev.target)) ev.preventDefault();
  });
  railEl.addEventListener("dragover", (ev) => {
    if (!dragSlug) return;
    if (!previewAt(ev)) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = "move";
  });
  railEl.addEventListener("drop", (ev) => {
    if (!dragSlug) return;
    ev.preventDefault();
    dropped = true;
    const slug = dragSlug;
    dragSlug = null;
    saveOrder(domOrder(), slug);
  });
  railEl.addEventListener("dragend", () => {
    dragSlug = null;
    if (!dropped) render();
    dropped = false;
  });
  railEl.addEventListener("keydown", (ev) => {
    const row = pinnedRow(ev.target);
    if (!row || !ev.altKey || !canWrite || (ev.key !== "ArrowUp" && ev.key !== "ArrowDown")) return;
    ev.preventDefault();
    const order = pinnedSlugs.slice();
    const i = order.indexOf(row.dataset.slug), j = i + (ev.key === "ArrowUp" ? -1 : 1);
    if (i < 0 || j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]];
    saveOrder(order, row.dataset.slug);
  });
  mainEl.addEventListener("change", (ev) => {
    const sel = ev.target.closest("select[data-act='snooze']");
    if (!sel || !sel.value) return;
    write(sel.closest(".card").dataset.slug, "snooze", { until: sel.value });
  });

  render();

  (async () => {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if (!db) return;
    db.collection("actions").onSnapshot(
      (snap) => {
        actions.clear();
        snap.docs.forEach((d) => { const body = d.data(); if (body && body.slug) actions.set(body.slug, body); });
        render();
      },
      () => { toast("Live updates unavailable; reload to refresh."); }
    );
    db.collection("settings").onSnapshot(
      (snap) => {
        let incoming = null;
        snap.docs.forEach((d) => {
          const body = d.data();
          if (body && body.key === "pinOrder" && Array.isArray(body.order)) incoming = body.order.slice();
        });
        if (!incoming || incoming.join("\n") === pinOrder.join("\n")) return;
        pinOrder = incoming;
        render();
      },
      () => {}
    );
    const user = await window.claude.use("user");
    if (user && user.can) {
      const ok = await user.can("data.write");
      if (ok === false) { canWrite = false; render(); }
    }
  })();
})();
</script>
